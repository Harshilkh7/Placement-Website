services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ../server
    ports:
      - "5000:5000"
    env_file:
      - ../server/.env
    depends_on:
      - mongodb

  client:
    build:
      context: ../client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
